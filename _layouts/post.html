---
layout: default
---

<article class="post">
  <header class="post-header">
    <p class="post-date">{{ page.date | date: "%-d %B %Y" }}</p>
    <h1>{{ page.title }}</h1>
  </header>

  <div class="post-content">
    {{ content }}
  </div>
</article>

<p class="back-link">
  <a href="{{ '/notebook/' | relative_url }}">← Back to Notebook</a>
</p>
